# 1. Chuyển hướng HTTP sang HTTPS cho toàn bộ domain/subdomain
server {
    listen 80;
    server_name cus.ryanandexen.qzz.io cus-staging.ryanandexen.qzz.io;
    return 301 https://$host$request_uri;
}

# 2. Xử lý HTTPS cho Môi trường PRODUCTION
server {
    listen 443 ssl http2;
    server_name cus.ryanandexen.qzz.io;

    # Chứng chỉ Origin CA 15 năm bạn đã lưu trên VM
    ssl_certificate /home/study-web/ssl/cert.pem;
    ssl_certificate_key /home/study-web/ssl/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        # Đẩy traffic HTTP nội bộ vào container Production
        proxy_pass http://127.0.0.1:8081;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# 3. Xử lý HTTPS cho Môi trường STAGING
server {
    listen 443 ssl http2;
    server_name cus-staging.ryanandexen.qzz.io;

    ssl_certificate /home/study-web/ssl/cert.pem;
    ssl_certificate_key /home/study-web/ssl/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        # Đẩy traffic HTTP nội bộ vào container Staging
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}