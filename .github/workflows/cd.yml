name: Study Web FE CD

on:
  workflow_run:
    workflows: ["ReactJS CI Pipeline"]
    types:
      - completed
    branches:
      - main
      - staging

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/frontend
  GITOPS_REPO: CUS-Study-Web/study-web-gitops

concurrency:
  group: fe-deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_name_lower: ${{ steps.format-name.outputs.image_name_lower }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Format image name to lowercase
        id: format-name
        run: |
          LOWER="${IMAGE_NAME,,}"
          echo "IMAGE_NAME_LOWER=${LOWER}" >> ${GITHUB_ENV}
          echo "image_name_lower=${LOWER}" >> ${GITHUB_OUTPUT}

      # Build Staging Image
      - name: Build and push (Staging)
        if: ${{ github.event.workflow_run.head_branch == 'staging' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:${{ github.event.workflow_run.head_sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:staging

      # Build Production Image
      - name: Build and push (Production)
        if: ${{ github.event.workflow_run.head_branch == 'main' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:${{ github.event.workflow_run.head_sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:latest

  deploy:
    needs: build-and-push
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    env:
      XDG_RUNTIME_DIR: /run/user/1000
      DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/1000/bus
    steps:
      - name: Setup Runtime Environment & Log in
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$(id -u)/bus"
          podman system migrate || true
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Checkout GitOps Manifests
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_PAT || secrets.GITHUB_TOKEN }}
          path: gitops-manifests
          ref: main

      - name: Deploy Locally on Self-Hosted
        id: deploy-step
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$(id -u)/bus"
          cd gitops-manifests
          if [ "${{ github.event.workflow_run.head_branch }}" = "main" ]; then
            IMAGE_TAG=${{ github.event.workflow_run.head_sha }} make fe-prod
          else
            make fe-staging
          fi